name: CI and delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore backend
        run: dotnet restore backend/Vistora.slnx
      - name: Build backend
        run: dotnet build backend/Vistora.slnx --no-restore --configuration Release
      - name: Test backend (including PostgreSQL integration)
        run: dotnet test backend/Vistora.Tests/Vistora.Tests.csproj --no-restore --configuration Release
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend and check TypeScript
        run: npm run build
        working-directory: frontend
      - name: Validate Compose configuration
        run: docker compose config --quiet

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: backend/Vistora.Api/Dockerfile
          - image: worker
            dockerfile: backend/Vistora.Worker/Dockerfile
          - image: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image repository
        id: names
        run: echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.names.outputs.image_prefix }}-${{ matrix.image }}:latest
            ${{ steps.names.outputs.image_prefix }}-${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VISTORA_API_URL=http://api:8080
