services:
  api:
    build:
      context: .
      dockerfile: backend/Vistora.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: ${VISTORA_POSTGRES_CONNECTION:-Host=postgres;Port=5432;Database=vistora;Username=vistora;Password=change-me}
      ConnectionStrings__Redis: ${VISTORA_REDIS_CONNECTION:-redis:6379}
      ConnectionStrings__RabbitMq: ${VISTORA_RABBITMQ_CONNECTION:-amqp://vistora:change-me@rabbitmq:5672/}
      Messaging__RabbitMq__QueueName: ${VISTORA_RABBITMQ_QUEUE:-vistora.messages}
      Storage__S3__Endpoint: ${VISTORA_STORAGE_S3_ENDPOINT:-}
      Storage__S3__Region: ${VISTORA_STORAGE_S3_REGION:-}
      Storage__S3__Bucket: ${VISTORA_STORAGE_S3_BUCKET:-}
      Storage__S3__AccessKeyId: ${VISTORA_STORAGE_S3_ACCESS_KEY_ID:-}
      Storage__S3__SecretAccessKey: ${VISTORA_STORAGE_S3_SECRET_ACCESS_KEY:-}
      Authentication__Authority: ${VISTORA_AUTHORITY:-}
      Authentication__Audience: ${VISTORA_AUTH_AUDIENCE:-}
    ports:
      - "8080:8080"
    volumes:
      - api-auth-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Vistora.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: ${VISTORA_POSTGRES_CONNECTION:-Host=postgres;Port=5432;Database=vistora;Username=vistora;Password=change-me}
      ConnectionStrings__Redis: ${VISTORA_REDIS_CONNECTION:-redis:6379}
      ConnectionStrings__RabbitMq: ${VISTORA_RABBITMQ_CONNECTION:-amqp://vistora:change-me@rabbitmq:5672/}
      Messaging__RabbitMq__QueueName: ${VISTORA_RABBITMQ_QUEUE:-vistora.messages}
      Storage__S3__Endpoint: ${VISTORA_STORAGE_S3_ENDPOINT:-}
      Storage__S3__Region: ${VISTORA_STORAGE_S3_REGION:-}
      Storage__S3__Bucket: ${VISTORA_STORAGE_S3_BUCKET:-}
      Storage__S3__AccessKeyId: ${VISTORA_STORAGE_S3_ACCESS_KEY_ID:-}
      Storage__S3__SecretAccessKey: ${VISTORA_STORAGE_S3_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vistora}
      POSTGRES_USER: ${POSTGRES_USER:-vistora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-vistora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  api-auth-keys:
