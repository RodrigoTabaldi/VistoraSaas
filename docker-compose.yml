services:
  api:
    build:
      context: .
      dockerfile: backend/Vistora.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: ${VISTORA_POSTGRES_CONNECTION:-}
      ConnectionStrings__Redis: ${VISTORA_REDIS_CONNECTION:-}
      ConnectionStrings__RabbitMq: ${VISTORA_RABBITMQ_CONNECTION:-}
      Storage__S3__Endpoint: ${VISTORA_STORAGE_S3_ENDPOINT:-}
      Storage__S3__Region: ${VISTORA_STORAGE_S3_REGION:-}
      Storage__S3__Bucket: ${VISTORA_STORAGE_S3_BUCKET:-}
      Storage__S3__AccessKeyId: ${VISTORA_STORAGE_S3_ACCESS_KEY_ID:-}
      Storage__S3__SecretAccessKey: ${VISTORA_STORAGE_S3_SECRET_ACCESS_KEY:-}
      Authentication__Authority: ${VISTORA_AUTHORITY:-}
      Authentication__Audience: ${VISTORA_AUTH_AUDIENCE:-}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  worker:
    build:
      context: .
      dockerfile: backend/Vistora.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: ${VISTORA_POSTGRES_CONNECTION:-}
      ConnectionStrings__Redis: ${VISTORA_REDIS_CONNECTION:-}
      ConnectionStrings__RabbitMq: ${VISTORA_RABBITMQ_CONNECTION:-}
      Storage__S3__Endpoint: ${VISTORA_STORAGE_S3_ENDPOINT:-}
      Storage__S3__Region: ${VISTORA_STORAGE_S3_REGION:-}
      Storage__S3__Bucket: ${VISTORA_STORAGE_S3_BUCKET:-}
      Storage__S3__AccessKeyId: ${VISTORA_STORAGE_S3_ACCESS_KEY_ID:-}
      Storage__S3__SecretAccessKey: ${VISTORA_STORAGE_S3_SECRET_ACCESS_KEY:-}
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vistora}
      POSTGRES_USER: ${POSTGRES_USER:-vistora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-vistora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

volumes:
  postgres-data:
