services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VISTORA_API_URL: http://api:8080
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Vistora.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: ${VISTORA_POSTGRES_CONNECTION:-Host=postgres;Port=5432;Database=vistora;Username=vistora_app;Password=change-me}
      ConnectionStrings__PostgresMigration: ${VISTORA_POSTGRES_MIGRATION_CONNECTION:-Host=postgres;Port=5432;Database=vistora;Username=vistora;Password=change-me}
      ConnectionStrings__Redis: ${VISTORA_REDIS_CONNECTION:-redis:6379}
      ConnectionStrings__RabbitMq: ${VISTORA_RABBITMQ_CONNECTION:-amqp://vistora:change-me@rabbitmq:5672/}
      Messaging__RabbitMq__QueueName: ${VISTORA_RABBITMQ_QUEUE:-vistora.messages}
      Storage__S3__Endpoint: ${VISTORA_STORAGE_S3_ENDPOINT:-http://rustfs:9000}
      Storage__S3__Region: ${VISTORA_STORAGE_S3_REGION:-us-east-1}
      Storage__S3__Bucket: ${VISTORA_STORAGE_S3_BUCKET:-vistora-private}
      Storage__S3__AccessKeyId: ${VISTORA_STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      Storage__S3__SecretAccessKey: ${VISTORA_STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin123}
      Storage__S3__AllowInsecureLocalEndpoint: ${VISTORA_S3_ALLOW_INSECURE_LOCAL:-true}
      Authentication__Authority: ${VISTORA_AUTHORITY:-}
      Authentication__Audience: ${VISTORA_AUTH_AUDIENCE:-}
    ports:
      - "${VISTORA_API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - api-auth-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Vistora.Worker/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: ${VISTORA_POSTGRES_CONNECTION:-Host=postgres;Port=5432;Database=vistora;Username=vistora_app;Password=change-me}
      ConnectionStrings__Redis: ${VISTORA_REDIS_CONNECTION:-redis:6379}
      ConnectionStrings__RabbitMq: ${VISTORA_RABBITMQ_CONNECTION:-amqp://vistora:change-me@rabbitmq:5672/}
      Messaging__RabbitMq__QueueName: ${VISTORA_RABBITMQ_QUEUE:-vistora.messages}
      Storage__S3__Endpoint: ${VISTORA_STORAGE_S3_ENDPOINT:-http://rustfs:9000}
      Storage__S3__Region: ${VISTORA_STORAGE_S3_REGION:-us-east-1}
      Storage__S3__Bucket: ${VISTORA_STORAGE_S3_BUCKET:-vistora-private}
      Storage__S3__AccessKeyId: ${VISTORA_STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      Storage__S3__SecretAccessKey: ${VISTORA_STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin123}
      Storage__S3__AllowInsecureLocalEndpoint: ${VISTORA_S3_ALLOW_INSECURE_LOCAL:-true}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Armazena evidências localmente por uma API compatível com S3.
  rustfs:
    image: rustfs/rustfs:1.0.0
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: ${VISTORA_STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      RUSTFS_SECRET_KEY: ${VISTORA_STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin123}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - minio

  # Prepara a raiz do volume para o usuário sem privilégios do RustFS.
  rustfs-permissions:
    image: alpine:3.22
    user: root
    volumes:
      - rustfs-data:/data
    command: ["sh", "-c", "chown 10001:10001 /data"]
    restart: "no"

  # Cria o bucket quando o endpoint S3 já está pronto e mantém reexecuções idempotentes.
  rustfs-init:
    image: amazon/aws-cli:2.36.44
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${VISTORA_STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${VISTORA_STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin123}
      AWS_DEFAULT_REGION: ${VISTORA_STORAGE_S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      VISTORA_BUCKET: ${VISTORA_STORAGE_S3_BUCKET:-vistora-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
          sleep 2
        done
        if ! aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$VISTORA_BUCKET" >/dev/null 2>&1; then
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$VISTORA_BUCKET"
        fi

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vistora}
      POSTGRES_USER: ${POSTGRES_USER:-vistora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-vistora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  api-auth-keys:
  rustfs-data:
